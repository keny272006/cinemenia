<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cinemenia - VIP Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0b0f19;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161f30;
      border: 1px solid #243049;
      border-radius: 16px;
      padding: 28px 20px;
      max-width: 390px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin: 6px 0 18px;
    }
    .amount-box {
      background: #0b0f19;
      border: 1px dashed #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .amount-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .amount {
      font-size: 32px;
      font-weight: 800;
      color: #22c55e;
      margin-top: 2px;
    }

    /* App Selection Grid */
    .app-title {
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .app-card {
      background: #0e1524;
      border: 1.5px solid #22304d;
      border-radius: 10px;
      padding: 12px 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .app-card:hover {
      border-color: #38bdf8;
      background: #111c30;
    }
    .app-card.selected {
      border-color: #38bdf8;
      background: #13233c;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }
    .app-card span {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .app-icon {
      font-size: 20px;
    }

    .pay-btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pay-btn:hover {
      background: #16a34a;
    }
    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      color: #38bdf8;
      min-height: 18px;
      margin-top: 12px;
    }
    .note {
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">cinemenia</div>
    <div class="subtitle">Complete payment to instantly unlock YouTube access</div>

    <div class="amount-box">
      <div class="amount-label">Access Fee</div>
      <div class="amount">₹15</div>
    </div>

    <div class="app-title">Select Payment App</div>
    <div class="app-grid">
      <div class="app-card selected" onclick="selectApp(this, 'PhonePe')">
        <div class="app-icon">🟣</div>
        <span>PhonePe</span>
      </div>
      <div class="app-card" onclick="selectApp(this, 'Google Pay')">
        <div class="app-icon">🔵</div>
        <span>GPay</span>
      </div>
      <div class="app-card" onclick="selectApp(this, 'Paytm')">
        <div class="app-icon">🔷</div>
        <span>Paytm / UPI</span>
      </div>
    </div>

    <button id="mainPayBtn" class="pay-btn">🚀 Pay ₹15 via PhonePe</button>
    <div id="statusMsg" class="status"></div>
    <div class="note">🔒 Instant redirect to YouTube playlist after payment</div>
  </div>

  <script>
    let selectedAppName = "PhonePe";

    function selectApp(element, name) {
      document.querySelectorAll(".app-card").forEach(el => el.classList.remove("selected"));
      element.classList.add("selected");
      selectedAppName = name;
      document.getElementById("mainPayBtn").innerText = `🚀 Pay ₹15 via ${name}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const rawListId = urlParams.get("list");

    document.getElementById("mainPayBtn").onclick = async function() {
      const btn = this;
      const status = document.getElementById("statusMsg");

      if (!rawListId) {
        alert("Error: Missing playlist link parameter (?list=). Please check the link sent in your DM.");
        return;
      }

      const playlistId = encodeURIComponent(rawListId.trim());
      // Append parameter so FamGateway's appended tracking params don't break the YouTube query
      const safeRedirectUrl = `https://www.youtube.com/playlist?list=${playlistId}&unlocked=true`;

      btn.disabled = true;
      status.innerText = `Connecting to ${selectedAppName}...`;

      try {
        const response = await fetch("https://famgateway.in/api/create-order.php", {
          method: "POST",
          headers: {
            "Authorization": "Bearer fam_57d7a34c06bb4cbca3636499091f296b3e009331",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            amount: 15.00,
            redirect_url: safeRedirectUrl
          })
        });

        if (response.status === 401) {
          // Fallback check if FamGateway prefers X-Api-Key
          const retryResponse = await fetch("https://famgateway.in/api/create-order.php", {
            method: "POST",
            headers: {
              "X-Api-Key": "fam_57d7a34c06bb4cbca3636499091f296b3e009331",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              amount: 15.00,
              redirect_url: safeRedirectUrl
            })
          });
          const retryData = await retryResponse.json();
          if (retryData.data && retryData.data.checkout_url) {
            status.innerText = "Redirecting to payment gateway...";
            window.location.href = retryData.data.checkout_url;
            return;
          }
        }

        const data = await response.json();

        if (data.data && data.data.checkout_url) {
          status.innerText = "Redirecting to payment gateway...";
          window.location.href = data.data.checkout_url;
        } else {
          status.innerText = "Error: " + (data.message || "Failed to create order. Try again.");
          btn.disabled = false;
        }
      } catch (err) {
        status.innerText = "Connection error. Please try again.";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
