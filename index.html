<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cinemenia - VIP Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0b0f19;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161f30;
      border: 1px solid #243049;
      border-radius: 16px;
      padding: 28px 20px;
      max-width: 390px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin: 6px 0 18px;
    }
    .amount-box {
      background: #0b0f19;
      border: 1px dashed #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .amount-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .amount {
      font-size: 32px;
      font-weight: 800;
      color: #22c55e;
      margin-top: 2px;
    }

    /* App Selection Grid */
    .app-title {
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .app-card {
      background: #0e1524;
      border: 1.5px solid #22304d;
      border-radius: 10px;
      padding: 12px 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .app-card:hover {
      border-color: #38bdf8;
      background: #111c30;
    }
    .app-card.selected {
      border-color: #38bdf8;
      background: #13233c;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }
    .app-card span {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .app-icon {
      font-size: 20px;
    }

    .pay-btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pay-btn:hover {
      background: #16a34a;
    }
    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      color: #38bdf8;
      min-height: 18px;
      margin-top: 12px;
      line-height: 1.4;
    }
    .note {
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
    }
    .qr-container {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #0b0f19;
      border-radius: 12px;
      border: 1px solid #243049;
    }
    .qr-container img {
      width: 190px;
      height: 190px;
      border-radius: 8px;
      background: #ffffff;
      padding: 6px;
    }
    .qr-note {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
    }
    .manual-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      color: #38bdf8;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">cinemenia</div>
    <div id="movieTitle" class="subtitle">Complete payment to instantly unlock YouTube access</div>

    <div class="amount-box">
      <div class="amount-label">Access Fee</div>
      <div id="displayAmount" class="amount">₹15</div>
    </div>

    <div class="app-title">Select Payment App</div>
    <div class="app-grid">
      <div class="app-card selected" onclick="selectApp(this, 'Google Pay', 'gpay')">
        <div class="app-icon">🔵</div>
        <span>GPay</span>
      </div>
      <div class="app-card" onclick="selectApp(this, 'PhonePe', 'phonepe')">
        <div class="app-icon">🟣</div>
        <span>PhonePe</span>
      </div>
      <div class="app-card" onclick="selectApp(this, 'Paytm', 'paytm')">
        <div class="app-icon">🔷</div>
        <span>Paytm</span>
      </div>
    </div>

    <button id="mainPayBtn" class="pay-btn">🚀 Open & Pay via GPay</button>
    <div id="statusMsg" class="status"></div>

    <div id="qrSection" class="qr-container">
      <img id="qrImage" src="" alt="Payment QR Code" />
      <div class="qr-note">Scan with any UPI app to pay</div>
      <a id="directIntentBtn" class="manual-link" style="display:none; margin-top:8px; font-weight:600;">Tap here if UPI app didn't open automatically</a>
      <div style="margin-top:10px;">
        <button id="copyUpiBtn" type="button" onclick="copyUpi()" style="background:#0e1524; color:#38bdf8; border:1px solid #22304d; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer;">📋 Copy UPI ID: 7490086192@fam</button>
      </div>
    </div>

    <div class="note">🔒 Instant redirect to YouTube playlist upon payment</div>
  </div>

  <script>
    // Read dynamic params from URL: ?list=...&price=...&title=...
    const urlParams = new URLSearchParams(window.location.search);
    const rawListId = urlParams.get("list");
    const rawPrice = urlParams.get("price") || urlParams.get("p") || "15";
    const rawTitle = urlParams.get("title");

    // Dynamic price calculation
    const payAmount = Math.max(1, parseFloat(rawPrice) || 15);
    document.getElementById("displayAmount").innerText = "₹" + payAmount;

    if (rawTitle) {
      document.getElementById("movieTitle").innerText = `Unlock ${decodeURIComponent(rawTitle)} on YouTube`;
    }

    let selectedAppName = "GPay";
    let selectedAppType = "gpay";

    function selectApp(element, name, type) {
      document.querySelectorAll(".app-card").forEach(el => el.classList.remove("selected"));
      element.classList.add("selected");
      selectedAppName = name;
      selectedAppType = type;
      document.getElementById("mainPayBtn").innerText = `🚀 Open & Pay via ${name}`;
    }

    function copyUpi() {
      navigator.clipboard.writeText("7490086192@fam");
      const b = document.getElementById("copyUpiBtn");
      b.innerText = "✅ Copied: 7490086192@fam";
      setTimeout(() => { b.innerText = "📋 Copy UPI ID: 7490086192@fam"; }, 2000);
    }

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let pollInterval = null;

    document.getElementById("mainPayBtn").onclick = async function() {
      const btn = this;
      const status = document.getElementById("statusMsg");
      const qrSection = document.getElementById("qrSection");
      const qrImage = document.getElementById("qrImage");
      const directIntentBtn = document.getElementById("directIntentBtn");

      if (!rawListId) {
        alert("Error: Missing playlist link parameter (?list=). Please check the link sent in your DM.");
        return;
      }

      const playlistId = encodeURIComponent(rawListId.trim());
      const safeRedirectUrl = `https://www.youtube.com/playlist?list=${playlistId}&unlocked=true`;

      btn.disabled = true;
      status.innerText = `Opening ${selectedAppName}...`;

      try {
        const response = await fetch("https://famgateway.in/api/create-order.php", {
          method: "POST",
          headers: {
            "Authorization": "Bearer fam_57d7a34c06bb4cbca3636499091f296b3e009331",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            amount: payAmount,
            redirect_url: safeRedirectUrl
          })
        });

        const data = await response.json();

        if (!data || !data.data || !data.data.order_id) {
          status.innerText = "Error: " + ((data && data.message) || "Failed to create order");
          btn.disabled = false;
          btn.innerText = `🚀 Open & Pay via ${selectedAppName}`;
          return;
        }

        const orderId = data.data.order_id;
        const upiIntent = data.data.upi_intent || "";
        const qrUrl = data.data.qr_url;

        // Clean up intent parameters: Remove 'tr' (Transaction Reference)
        // 'tr' causes NPCI unregistered merchant errors on personal @fam handles
        const upiParams = upiIntent.replace(/^upi:\/\/pay\?/, "");
        const parsedParams = new URLSearchParams(upiParams);
        parsedParams.delete("tr");
        const cleanParams = parsedParams.toString();
        const cleanUpiIntent = `upi://pay?${cleanParams}`;

        let deepLink = cleanUpiIntent;

        if (selectedAppType === "gpay") {
          deepLink = `tez://upi/pay?${cleanParams}`;
        } else if (selectedAppType === "phonepe") {
          deepLink = `phonepe://pay?${cleanParams}`;
        } else if (selectedAppType === "paytm") {
          deepLink = `paytmmp://pay?${cleanParams}`;
        }

        // Start polling payment status in the background
        startPolling(orderId, safeRedirectUrl, status);

        if (isMobile && upiIntent) {
          status.innerText = `Opening ${selectedAppName}... Complete ₹${payAmount} in your app.`;

          directIntentBtn.href = cleanUpiIntent;
          directIntentBtn.style.display = "inline-block";
          directIntentBtn.innerText = `🔄 Tap here to open in any UPI App`;
          qrSection.style.display = "block";
          qrImage.src = qrUrl;

          // Attempt to open the selected UPI app directly
          window.location.href = deepLink;

        } else {
          // Desktop user or QR preference: display QR Code
          status.innerText = `Scan QR code with ${selectedAppName} or any UPI app`;
          qrImage.src = qrUrl;
          qrSection.style.display = "block";
        }

      } catch (err) {
        console.error("Payment error:", err);
        status.innerText = "Network slow/timeout. Tap Retry.";
        btn.disabled = false;
        btn.innerText = `🔄 Retry via ${selectedAppName}`;
      }
    };

    function startPolling(orderId, redirectUrl, statusElem) {
      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`https://famgateway.in/api/checkout-status.php?order_id=${encodeURIComponent(orderId)}`);
          const data = await res.json();

          if (data.status === "success") {
            clearInterval(pollInterval);
            statusElem.style.color = "#22c55e";
            statusElem.innerText = "✅ Payment Successful! Unlocking YouTube playlist...";
            setTimeout(() => {
              window.location.href = redirectUrl;
            }, 1000);
          } else if (data.status === "expired") {
            clearInterval(pollInterval);
            statusElem.style.color = "#ef4444";
            statusElem.innerText = "Order expired. Please refresh and try again.";
          }
        } catch (e) {
          // Silent catch on network hiccups during polling
        }
      }, 2500);
    }
  </script>
</body>
</html>
